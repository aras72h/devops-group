# ─────────────────────────────────────────────────────────────────────────────
# Grafana datasource provisioning
#
# This file is loaded automatically when Grafana starts.
# The Prometheus datasource is available immediately without manual setup.
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
