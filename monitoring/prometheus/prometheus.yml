# ─────────────────────────────────────────────────────────────────────────────
# Prometheus configuration
#
# Scrapes metrics from:
#   - Prometheus itself       (meta)
#   - Node Exporter           (host CPU, memory, disk, network)
#   - cAdvisor                (per-container CPU, memory, network)
#   - The Team Notes API      (app-level: request count, response time)
# ─────────────────────────────────────────────────────────────────────────────

global:
  scrape_interval: 15s # pull metrics every 15 seconds
  evaluation_interval: 15s # evaluate alert rules every 15 seconds

scrape_configs:
  # ── Prometheus itself ───────────────────────────────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ── Node Exporter — host-level metrics ─────────────────────────────────────
  # CPU, memory, disk I/O, network I/O of the Docker host machine
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # ── cAdvisor — per-container metrics ───────────────────────────────────────
  # CPU %, memory usage, network bytes in/out per container
  # This is what lets us see individual service resource consumption
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  # ── Team Notes API ──────────────────────────────────────────────────────────
  # The API doesn't expose a /metrics endpoint out of the box.
  # We scrape it via the Blackbox Exporter probe instead (see blackbox job),
  # or rely on cAdvisor for container-level stats.
  #
  # To add real app-level metrics (request rate, latency, error rate),
  # install prom-client in the API and expose a /metrics endpoint,
  # then add a scrape job pointing to api:3000 with metrics_path: /metrics.
  - job_name: "team-notes-api-health"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://api:3000/health
          - http://api:3000/api/notes
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
