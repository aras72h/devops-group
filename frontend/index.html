<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Notes</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      min-height: 100vh;
    }

    header {
      background: #2563eb;
      color: #fff;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 1.25rem; font-weight: 600; }
    #status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #86efac;
      title: "API status";
    }
    #status-dot.error { background: #f87171; }

    main {
      max-width: 720px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    /* ── Form ── */
    #note-form {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 2rem;
    }
    #note-form h2 { font-size: 1rem; margin-bottom: 1rem; color: #374151; }

    label { display: block; font-size: 0.875rem; color: #6b7280; margin-bottom: .25rem; }

    input[type="text"], textarea {
      width: 100%;
      padding: .5rem .75rem;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 0.9rem;
      font-family: inherit;
      margin-bottom: .75rem;
      transition: border-color .15s;
    }
    input[type="text"]:focus, textarea:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,.15);
    }
    textarea { resize: vertical; min-height: 80px; }

    .btn-row { display: flex; gap: .5rem; }

    button {
      padding: .45rem 1rem;
      border: none;
      border-radius: 6px;
      font-size: 0.875rem;
      cursor: pointer;
      font-family: inherit;
      font-weight: 500;
    }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: #e5e7eb; color: #374151; }
    .btn-secondary:hover { background: #d1d5db; }

    /* ── Notes list ── */
    #notes-list { display: flex; flex-direction: column; gap: .75rem; }

    .note-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 1rem 1.25rem;
    }
    .note-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
    }
    .note-title { font-weight: 600; font-size: 1rem; }
    .note-content { margin-top: .5rem; color: #4b5563; font-size: 0.9rem; white-space: pre-wrap; }
    .note-date { font-size: 0.75rem; color: #9ca3af; margin-top: .5rem; }

    .note-actions { display: flex; gap: .4rem; flex-shrink: 0; }
    .btn-edit   { background: #eff6ff; color: #2563eb; }
    .btn-edit:hover { background: #dbeafe; }
    .btn-delete { background: #fff1f2; color: #e11d48; }
    .btn-delete:hover { background: #ffe4e6; }

    .empty-state {
      text-align: center;
      color: #9ca3af;
      padding: 3rem 0;
      font-size: 0.9rem;
    }

    .error-banner {
      background: #fff1f2;
      border: 1px solid #fecdd3;
      color: #9f1239;
      border-radius: 6px;
      padding: .75rem 1rem;
      margin-bottom: 1rem;
      font-size: 0.875rem;
      display: none;
    }
  </style>
</head>
<body>

<header>
  <h1>📝 Team Notes</h1>
  <div id="status-dot" title="Checking API…"></div>
</header>

<main>
  <div id="error-banner" class="error-banner"></div>

  <form id="note-form" novalidate>
    <h2 id="form-title">New note</h2>
    <input type="hidden" id="edit-id" value="" />
    <label for="title">Title</label>
    <input type="text" id="title" placeholder="What's this note about?" required />
    <label for="content">Content</label>
    <textarea id="content" placeholder="Write something…"></textarea>
    <div class="btn-row">
      <button type="submit" class="btn-primary" id="submit-btn">Save note</button>
      <button type="button" class="btn-secondary" id="cancel-btn" style="display:none">Cancel</button>
    </div>
  </form>

  <div id="notes-list"></div>
</main>

<script>
  // ── Config ──────────────────────────────────────────────────────────────────
  // When running behind the reverse proxy in production, the frontend and API
  // share the same origin so we use a relative path.  For local dev without
  // Docker, set API_URL to the full address in your browser console.
  const API_URL = window.API_URL || '/api/notes';

  // ── DOM refs ────────────────────────────────────────────────────────────────
  const form        = document.getElementById('note-form');
  const formTitle   = document.getElementById('form-title');
  const editIdInput = document.getElementById('edit-id');
  const titleInput  = document.getElementById('title');
  const contentInput = document.getElementById('content');
  const submitBtn   = document.getElementById('submit-btn');
  const cancelBtn   = document.getElementById('cancel-btn');
  const notesList   = document.getElementById('notes-list');
  const errorBanner = document.getElementById('error-banner');
  const statusDot   = document.getElementById('status-dot');

  // ── API helpers ─────────────────────────────────────────────────────────────
  async function apiFetch(path, options = {}) {
    const res = await fetch(API_URL + path, {
      headers: { 'Content-Type': 'application/json' },
      ...options,
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.error || `HTTP ${res.status}`);
    }
    if (res.status === 204) return null;
    return res.json();
  }

  function showError(msg) {
    errorBanner.textContent = msg;
    errorBanner.style.display = 'block';
    setTimeout(() => { errorBanner.style.display = 'none'; }, 4000);
  }

  // ── Health check ────────────────────────────────────────────────────────────
  async function checkHealth() {
    try {
      const res = await fetch('/health');
      statusDot.classList.toggle('error', !res.ok);
      statusDot.title = res.ok ? 'API is healthy' : 'API error';
    } catch {
      statusDot.classList.add('error');
      statusDot.title = 'Cannot reach API';
    }
  }
  checkHealth();
  setInterval(checkHealth, 30_000);

  // ── Render ──────────────────────────────────────────────────────────────────
  function formatDate(iso) {
    return new Date(iso).toLocaleString(undefined, {
      dateStyle: 'medium', timeStyle: 'short',
    });
  }

  function renderNotes(notes) {
    if (notes.length === 0) {
      notesList.innerHTML = '<p class="empty-state">No notes yet. Create your first one above.</p>';
      return;
    }
    notesList.innerHTML = notes.map(note => `
      <div class="note-card" data-id="${note.id}">
        <div class="note-card-header">
          <span class="note-title">${escHtml(note.title)}</span>
          <div class="note-actions">
            <button class="btn-edit" onclick="startEdit(${note.id})">Edit</button>
            <button class="btn-delete" onclick="deleteNote(${note.id})">Delete</button>
          </div>
        </div>
        ${note.content ? `<p class="note-content">${escHtml(note.content)}</p>` : ''}
        <p class="note-date">Created ${formatDate(note.created_at)}${
          note.updated_at !== note.created_at
            ? ' · Edited ' + formatDate(note.updated_at)
            : ''
        }</p>
      </div>
    `).join('');
  }

  function escHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ── Load notes ──────────────────────────────────────────────────────────────
  async function loadNotes() {
    try {
      const notes = await apiFetch('');
      renderNotes(notes);
    } catch (err) {
      showError('Could not load notes: ' + err.message);
    }
  }

  // ── Create / Update ─────────────────────────────────────────────────────────
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const title   = titleInput.value.trim();
    const content = contentInput.value.trim();
    const editId  = editIdInput.value;

    if (!title) { titleInput.focus(); return; }

    try {
      if (editId) {
        await apiFetch(`/${editId}`, {
          method: 'PUT',
          body: JSON.stringify({ title, content }),
        });
      } else {
        await apiFetch('', {
          method: 'POST',
          body: JSON.stringify({ title, content }),
        });
      }
      resetForm();
      loadNotes();
    } catch (err) {
      showError('Could not save note: ' + err.message);
    }
  });

  // ── Edit ────────────────────────────────────────────────────────────────────
  async function startEdit(id) {
    try {
      const note = await apiFetch(`/${id}`);
      editIdInput.value    = note.id;
      titleInput.value     = note.title;
      contentInput.value   = note.content;
      formTitle.textContent = 'Edit note';
      submitBtn.textContent = 'Update note';
      cancelBtn.style.display = '';
      titleInput.focus();
      form.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch (err) {
      showError('Could not load note: ' + err.message);
    }
  }

  cancelBtn.addEventListener('click', resetForm);

  function resetForm() {
    form.reset();
    editIdInput.value     = '';
    formTitle.textContent = 'New note';
    submitBtn.textContent = 'Save note';
    cancelBtn.style.display = 'none';
  }

  // ── Delete ──────────────────────────────────────────────────────────────────
  async function deleteNote(id) {
    if (!confirm('Delete this note?')) return;
    try {
      await apiFetch(`/${id}`, { method: 'DELETE' });
      loadNotes();
    } catch (err) {
      showError('Could not delete note: ' + err.message);
    }
  }

  // ── Boot ────────────────────────────────────────────────────────────────────
  loadNotes();
</script>
</body>
</html>
