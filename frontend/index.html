<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Team Notes</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: system-ui, sans-serif;
        background: #f5f5f5;
        color: #1a1a1a;
        min-height: 100vh;
      }

      /* ── Header ── */
      header {
        background: #2563eb;
        color: #fff;
        padding: 0.85rem 1.5rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }
      header h1 {
        font-size: 1.15rem;
        font-weight: 600;
        flex-shrink: 0;
      }

      .header-tools {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .tool-link {
        color: rgba(255, 255, 255, 0.85);
        text-decoration: none;
        font-size: 0.8rem;
        font-weight: 500;
        padding: 0.25rem 0.6rem;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 5px;
        transition: background 0.15s;
        white-space: nowrap;
      }
      .tool-link:hover {
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
      }

      #status-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #86efac;
        flex-shrink: 0;
        cursor: default;
      }
      #status-dot.error {
        background: #f87171;
      }

      /* ── Load-shed banner ── */
      #shed-banner {
        display: none;
        background: #fef3c7;
        border-bottom: 1px solid #fcd34d;
        color: #92400e;
        padding: 0.6rem 1.5rem;
        font-size: 0.875rem;
        font-weight: 500;
        text-align: center;
      }
      #shed-banner.active {
        display: block;
      }

      /* ── Layout ── */
      .page {
        max-width: 1100px;
        margin: 1.5rem auto;
        padding: 0 1rem;
        display: grid;
        grid-template-columns: 1fr 340px;
        gap: 1.5rem;
        align-items: start;
      }
      @media (max-width: 800px) {
        .page {
          grid-template-columns: 1fr;
        }
      }

      /* ── Form ── */
      #note-form {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 1.25rem;
        margin-bottom: 1.25rem;
      }
      #note-form h2 {
        font-size: 1rem;
        margin-bottom: 1rem;
        color: #374151;
      }

      label {
        display: block;
        font-size: 0.875rem;
        color: #6b7280;
        margin-bottom: 0.25rem;
      }

      input[type="text"],
      textarea {
        width: 100%;
        padding: 0.5rem 0.75rem;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 0.9rem;
        font-family: inherit;
        margin-bottom: 0.75rem;
        transition: border-color 0.15s;
      }
      input[type="text"]:focus,
      textarea:focus {
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
      }
      textarea {
        resize: vertical;
        min-height: 80px;
      }

      .btn-row {
        display: flex;
        gap: 0.5rem;
      }
      button {
        padding: 0.45rem 1rem;
        border: none;
        border-radius: 6px;
        font-size: 0.875rem;
        cursor: pointer;
        font-family: inherit;
        font-weight: 500;
      }
      .btn-primary {
        background: #2563eb;
        color: #fff;
      }
      .btn-primary:hover {
        background: #1d4ed8;
      }
      .btn-secondary {
        background: #e5e7eb;
        color: #374151;
      }
      .btn-secondary:hover {
        background: #d1d5db;
      }

      /* ── Notes list ── */
      #notes-list {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .note-card {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 1rem 1.25rem;
      }
      .note-card-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 1rem;
      }
      .note-title {
        font-weight: 600;
        font-size: 1rem;
      }
      .note-content {
        margin-top: 0.5rem;
        color: #4b5563;
        font-size: 0.9rem;
        white-space: pre-wrap;
      }
      .note-date {
        font-size: 0.75rem;
        color: #9ca3af;
        margin-top: 0.5rem;
      }

      .note-actions {
        display: flex;
        gap: 0.4rem;
        flex-shrink: 0;
      }
      .btn-edit {
        background: #eff6ff;
        color: #2563eb;
      }
      .btn-edit:hover {
        background: #dbeafe;
      }
      .btn-delete {
        background: #fff1f2;
        color: #e11d48;
      }
      .btn-delete:hover {
        background: #ffe4e6;
      }

      .empty-state {
        text-align: center;
        color: #9ca3af;
        padding: 3rem 0;
        font-size: 0.9rem;
      }

      .error-banner {
        background: #fff1f2;
        border: 1px solid #fecdd3;
        color: #9f1239;
        border-radius: 6px;
        padding: 0.75rem 1rem;
        margin-bottom: 1rem;
        font-size: 0.875rem;
        display: none;
      }

      /* ── Sidebar panels ── */
      .sidebar {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .panel {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        overflow: hidden;
      }
      .panel-header {
        padding: 0.65rem 1rem;
        background: #f9fafb;
        border-bottom: 1px solid #e5e7eb;
        font-size: 0.8rem;
        font-weight: 600;
        color: #374151;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .panel-header .badge {
        font-size: 0.7rem;
        font-weight: 500;
        padding: 0.1rem 0.4rem;
        border-radius: 999px;
        background: #e5e7eb;
        color: #6b7280;
      }
      .panel-header .badge.shedding {
        background: #fef3c7;
        color: #92400e;
      }

      /* ── Cluster panel ── */
      #cluster-list {
        padding: 0.75rem 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        min-height: 48px;
      }
      .replica-row {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        font-size: 0.8rem;
      }
      .replica-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .replica-dot.healthy {
        background: #22c55e;
      }
      .replica-dot.warn {
        background: #f59e0b;
      }
      .replica-dot.critical {
        background: #ef4444;
      }

      .replica-id {
        color: #374151;
        font-weight: 500;
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .replica-p95 {
        color: #9ca3af;
        font-size: 0.75rem;
        flex-shrink: 0;
      }
      .replica-rps {
        color: #9ca3af;
        font-size: 0.75rem;
        flex-shrink: 0;
      }

      .cluster-empty {
        font-size: 0.8rem;
        color: #9ca3af;
        padding: 0.25rem 0;
        text-align: center;
      }

      /* ── Message board ── */
      #message-board {
        height: 280px;
        overflow-y: auto;
        padding: 0.5rem 0.75rem;
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
        font-family: "Menlo", "Consolas", monospace;
        font-size: 0.72rem;
        line-height: 1.5;
      }
      .msg-line {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: #374151;
        padding: 0.1rem 0;
        border-bottom: 1px solid #f3f4f6;
        animation: fadeIn 0.3s ease;
      }
      .msg-line.healthy {
        color: #16a34a;
      }
      .msg-line.warn {
        color: #d97706;
      }
      .msg-line.critical {
        color: #dc2626;
      }
      .msg-ts {
        color: #9ca3af;
        margin-right: 0.4rem;
        font-size: 0.68rem;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-2px);
        }
        to {
          opacity: 1;
        }
      }

      /* ── Scrollbar (webkit) ── */
      #message-board::-webkit-scrollbar {
        width: 4px;
      }
      #message-board::-webkit-scrollbar-track {
        background: transparent;
      }
      #message-board::-webkit-scrollbar-thumb {
        background: #d1d5db;
        border-radius: 2px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>📝 Team Notes</h1>
      <div class="header-tools">
        <a
          class="tool-link"
          href="http://localhost:3001"
          target="_blank"
          rel="noopener"
          >Grafana ↗</a
        >
        <a
          class="tool-link"
          href="http://localhost:8089"
          target="_blank"
          rel="noopener"
          >Locust ↗</a
        >
        <div id="status-dot" title="Checking API…"></div>
      </div>
    </header>

    <div id="shed-banner">
      ⚠ System under high load — writes temporarily paused. Reads still work.
    </div>

    <div class="page">
      <!-- ── Left column: form + notes ── -->
      <div>
        <div id="error-banner" class="error-banner"></div>

        <form id="note-form" novalidate>
          <h2 id="form-title">New note</h2>
          <input type="hidden" id="edit-id" value="" />
          <label for="title">Title</label>
          <input
            type="text"
            id="title"
            placeholder="What's this note about?"
            required
          />
          <label for="content">Content</label>
          <textarea id="content" placeholder="Write something…"></textarea>
          <div class="btn-row">
            <button type="submit" class="btn-primary" id="submit-btn">
              Save note
            </button>
            <button
              type="button"
              class="btn-secondary"
              id="cancel-btn"
              style="display: none"
            >
              Cancel
            </button>
          </div>
        </form>

        <div id="notes-list"></div>
      </div>

      <!-- ── Right column: cluster + message board ── -->
      <div class="sidebar">
        <!-- Replica status -->
        <div class="panel">
          <div class="panel-header">
            Replicas
            <span class="badge" id="cluster-badge">–</span>
          </div>
          <div id="cluster-list">
            <p class="cluster-empty">Waiting for agents…</p>
          </div>
        </div>

        <!-- Message board -->
        <div class="panel">
          <div class="panel-header">
            Message Board
            <span class="badge" id="board-badge">live</span>
          </div>
          <div id="message-board">
            <div class="msg-line" style="color: #9ca3af">
              Waiting for messages…
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- .page -->

    <script>
      // ── Config ──────────────────────────────────────────────────────────────────
      const API_URL = window.API_URL || "/api/notes";
      const CLUSTER_URL = "/api/cluster/status";
      const POLL_MS = 3_000; // how often to poll cluster status
      const MAX_MESSAGES = 50; // message board history cap

      // ── DOM refs ────────────────────────────────────────────────────────────────
      const form = document.getElementById("note-form");
      const formTitle = document.getElementById("form-title");
      const editIdInput = document.getElementById("edit-id");
      const titleInput = document.getElementById("title");
      const contentInput = document.getElementById("content");
      const submitBtn = document.getElementById("submit-btn");
      const cancelBtn = document.getElementById("cancel-btn");
      const notesList = document.getElementById("notes-list");
      const errorBanner = document.getElementById("error-banner");
      const statusDot = document.getElementById("status-dot");
      const shedBanner = document.getElementById("shed-banner");
      const clusterList = document.getElementById("cluster-list");
      const clusterBadge = document.getElementById("cluster-badge");
      const boardEl = document.getElementById("message-board");
      const boardBadge = document.getElementById("board-badge");

      // ── Message board state ─────────────────────────────────────────────────────
      // Keyed by replica id — stores the last message seen from each replica
      // so we only add a line when something changes.
      const lastMessages = {};
      let messageLines = []; // DOM lines currently in the board

      // ── Helpers ─────────────────────────────────────────────────────────────────
      function escHtml(str) {
        return str
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function formatDate(iso) {
        return new Date(iso).toLocaleString(undefined, {
          dateStyle: "medium",
          timeStyle: "short",
        });
      }

      function fmtTime(iso) {
        return new Date(iso).toLocaleTimeString(undefined, {
          timeStyle: "medium",
        });
      }

      function showError(msg) {
        errorBanner.textContent = msg;
        errorBanner.style.display = "block";
        setTimeout(() => {
          errorBanner.style.display = "none";
        }, 5000);
      }

      // ── Health check ────────────────────────────────────────────────────────────
      async function checkHealth() {
        try {
          const res = await fetch("/health");
          statusDot.classList.toggle("error", !res.ok);
          statusDot.title = res.ok ? "API is healthy" : "API error";
        } catch {
          statusDot.classList.add("error");
          statusDot.title = "Cannot reach API";
        }
      }
      checkHealth();
      setInterval(checkHealth, 30_000);

      // ── Cluster polling ─────────────────────────────────────────────────────────
      async function pollCluster() {
        try {
          const data = await fetch(CLUSTER_URL).then((r) => r.json());
          renderCluster(data);
        } catch {
          // MinIO or API not ready yet — silent, try again next poll
        }
      }

      function replicaClass(r) {
        if (r.p95_ms > 800 && r.error_rate > 0.05) return "critical";
        if (r.p95_ms > 800 || r.error_rate > 0.05) return "warn";
        return "healthy";
      }

      function renderCluster(data) {
        const replicas = data.replicas || [];

        // ── Shed banner ──────────────────────────────────────────────────────────
        shedBanner.classList.toggle("active", !!data.shedding);

        // ── Badge ────────────────────────────────────────────────────────────────
        clusterBadge.textContent = replicas.length
          ? `${replicas.length} replica${replicas.length !== 1 ? "s" : ""}`
          : "–";
        clusterBadge.classList.toggle("shedding", !!data.shedding);

        // ── Replica dots ─────────────────────────────────────────────────────────
        if (replicas.length === 0) {
          clusterList.innerHTML =
            '<p class="cluster-empty">Waiting for agents…</p>';
        } else {
          clusterList.innerHTML = replicas
            .map((r) => {
              const cls = replicaClass(r);
              const label = r.id.replace(/^devops-group-/, ""); // trim compose prefix
              return `
          <div class="replica-row">
            <div class="replica-dot ${cls}" title="${escHtml(r.message)}"></div>
            <span class="replica-id" title="${escHtml(r.id)}">${escHtml(label)}</span>
            <span class="replica-rps">${r.rps} rps</span>
            <span class="replica-p95">p95 ${r.p95_ms}ms</span>
          </div>
        `;
            })
            .join("");
        }

        // ── Message board ─────────────────────────────────────────────────────────
        let changed = false;
        for (const r of replicas) {
          const msg = r.message;
          if (lastMessages[r.id] !== msg) {
            lastMessages[r.id] = msg;
            changed = true;

            const cls = replicaClass(r);
            const ts = fmtTime(r.timestamp);
            messageLines.unshift({ msg, cls, ts });
          }
        }

        if (changed) {
          // Trim to cap
          if (messageLines.length > MAX_MESSAGES) {
            messageLines = messageLines.slice(0, MAX_MESSAGES);
          }

          boardEl.innerHTML = messageLines
            .map(
              (l) => `
        <div class="msg-line ${l.cls}">
          <span class="msg-ts">${escHtml(l.ts)}</span>${escHtml(l.msg)}
        </div>
      `,
            )
            .join("");

          boardBadge.textContent = `${messageLines.length} msgs`;
        }
      }

      pollCluster();
      setInterval(pollCluster, POLL_MS);

      // ── Render notes ─────────────────────────────────────────────────────────────
      function renderNotes(notes) {
        if (notes.length === 0) {
          notesList.innerHTML =
            '<p class="empty-state">No notes yet. Create your first one above.</p>';
          return;
        }
        notesList.innerHTML = notes
          .map(
            (note) => `
      <div class="note-card" data-id="${note.id}">
        <div class="note-card-header">
          <span class="note-title">${escHtml(note.title)}</span>
          <div class="note-actions">
            <button class="btn-edit"   onclick="startEdit(${note.id})">Edit</button>
            <button class="btn-delete" onclick="deleteNote(${note.id})">Delete</button>
          </div>
        </div>
        ${note.content ? `<p class="note-content">${escHtml(note.content)}</p>` : ""}
        <p class="note-date">Created ${formatDate(note.created_at)}${
          note.updated_at !== note.created_at
            ? " · Edited " + formatDate(note.updated_at)
            : ""
        }</p>
      </div>
    `,
          )
          .join("");
      }

      // ── API helpers ──────────────────────────────────────────────────────────────
      async function apiFetch(path, options = {}) {
        const res = await fetch(API_URL + path, {
          headers: { "Content-Type": "application/json" },
          ...options,
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          // Surface the load-shed message specifically
          if (res.status === 503 && body.shedding) {
            throw new Error(
              "Server is under high load — try again in a moment",
            );
          }
          throw new Error(body.error || `HTTP ${res.status}`);
        }
        if (res.status === 204) return null;
        return res.json();
      }

      // ── Load notes ───────────────────────────────────────────────────────────────
      async function loadNotes() {
        try {
          const notes = await apiFetch("");
          renderNotes(notes);
        } catch (err) {
          showError("Could not load notes: " + err.message);
        }
      }

      // ── Create / Update ──────────────────────────────────────────────────────────
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const title = titleInput.value.trim();
        const content = contentInput.value.trim();
        const editId = editIdInput.value;

        if (!title) {
          titleInput.focus();
          return;
        }

        try {
          if (editId) {
            await apiFetch(`/${editId}`, {
              method: "PUT",
              body: JSON.stringify({ title, content }),
            });
          } else {
            await apiFetch("", {
              method: "POST",
              body: JSON.stringify({ title, content }),
            });
          }
          resetForm();
          loadNotes();
        } catch (err) {
          showError(err.message);
        }
      });

      // ── Edit ─────────────────────────────────────────────────────────────────────
      async function startEdit(id) {
        try {
          const note = await apiFetch(`/${id}`);
          editIdInput.value = note.id;
          titleInput.value = note.title;
          contentInput.value = note.content;
          formTitle.textContent = "Edit note";
          submitBtn.textContent = "Update note";
          cancelBtn.style.display = "";
          titleInput.focus();
          form.scrollIntoView({ behavior: "smooth", block: "start" });
        } catch (err) {
          showError("Could not load note: " + err.message);
        }
      }

      cancelBtn.addEventListener("click", resetForm);

      function resetForm() {
        form.reset();
        editIdInput.value = "";
        formTitle.textContent = "New note";
        submitBtn.textContent = "Save note";
        cancelBtn.style.display = "none";
      }

      // ── Delete ───────────────────────────────────────────────────────────────────
      async function deleteNote(id) {
        if (!confirm("Delete this note?")) return;
        try {
          await apiFetch(`/${id}`, { method: "DELETE" });
          loadNotes();
        } catch (err) {
          showError(err.message);
        }
      }

      // ── Boot ─────────────────────────────────────────────────────────────────────
      loadNotes();
    </script>
  </body>
</html>
