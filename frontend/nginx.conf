server {
    listen 80;
    server_name _;

    # Serve the static frontend
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the api container.
    # Docker Compose puts every service on a shared network; the hostname
    # is the service name defined in docker-compose.yml ("api").
    location /api/ {
        proxy_pass         http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Forward health checks too so the status dot in the UI works
    location /health {
        proxy_pass         http://api:3000/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # Cluster status — agent message board data
    location /api/cluster/ {
        proxy_pass         http://api:3000/api/cluster/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
