name: CI / CD

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

env:
  REGISTRY:       ghcr.io
  API_IMAGE:      ghcr.io/${{ github.repository }}/api
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend

jobs:

  # ── Test ────────────────────────────────────────────────────────────────────
  # Runs on every push and PR. No dependencies installed — tests are
  # self-contained and stub all third-party modules internally.
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        working-directory: api
        run: npm test

  # ── Build & push ─────────────────────────────────────────────────────────────
  # Builds Docker images and pushes to GHCR on every push to dev.
  # Requires secret: GHCR_TOKEN (GitHub PAT with write:packages + repo scopes)
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── Deploy ───────────────────────────────────────────────────────────────────
  # SSHes into the production VPS and restarts the stack with the new images.
  #
  # Required secrets (Settings → Secrets and variables → Actions):
  #   VPS_HOST      IP or hostname of the production server
  #   VPS_USER      SSH username on the server (e.g. deploy)
  #   VPS_SSH_KEY   Full contents of the private SSH key (~/.ssh/id_ed25519)
  #   GHCR_TOKEN    Same token used in the build step above
  #
  # This job is skipped automatically if VPS_HOST is not set.
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: build

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/team-notes
            git pull origin dev
            echo "${{ secrets.GHCR_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export IMAGE_TAG=${{ github.sha }}
            export REGISTRY=ghcr.io/${{ github.repository }}
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              pull api frontend
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              up -d --no-build
            docker image prune -f

