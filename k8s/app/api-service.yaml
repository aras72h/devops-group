
# ─────────────────────────────────────────────────────────────────────────────
# Team Notes API — Service
#
# ClusterIP (the default) means this Service is only reachable inside the
# cluster — not from the internet. The frontend Pod uses this to call the API.
#
# DNS: api.notes.svc.cluster.local:3000
# Short form (within the same namespace): api:3000
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: notes
  labels:
    app: api
spec:
  type: ClusterIP
  selector:
    app: api        # routes to all Pods with this label
  ports:
    - port: 3000
      targetPort: 3000
