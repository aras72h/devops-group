
# ─────────────────────────────────────────────────────────────────────────────
# PostgreSQL — Services
#
# Two services for the database:
#
# 1. Headless Service (ClusterIP: None) — required by StatefulSet for stable
#    Pod DNS names. Pods get addresses like db-0.db.notes.svc.cluster.local.
#
# 2. Regular ClusterIP Service — used by the API to connect to Postgres.
#    The API just uses hostname "db" on port 5432, same as in Docker Compose.
# ─────────────────────────────────────────────────────────────────────────────

# Headless service — for StatefulSet DNS
apiVersion: v1
kind: Service
metadata:
  name: db-headless
  namespace: notes
  labels:
    app: db
spec:
  clusterIP: None
  selector:
    app: db
  ports:
    - port: 5432
      targetPort: 5432
---
# Regular service — used by the API
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: notes
  labels:
    app: db
spec:
  type: ClusterIP
  selector:
    app: db
  ports:
    - port: 5432
      targetPort: 5432
