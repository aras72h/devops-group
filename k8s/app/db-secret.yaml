# ─────────────────────────────────────────────────────────────────────────────
# Database credentials — Secret
#
# Secrets are base64-encoded (NOT encrypted by default in k3s).
# For a real production system, use a secrets manager (Vault, Sealed Secrets,
# External Secrets Operator) instead of committing secrets to git.
#
# These values are base64 of: notes / notes_user / notes_pass
# To encode your own: echo -n "mypassword" | base64
#
# IMPORTANT: This file is committed to git for convenience.
# In production, NEVER commit secrets to version control.
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: notes
type: Opaque
data:
  db-name: bm90ZXM= # notes
  db-user: bm90ZXNfdXNlcg== # notes_user
  db-password: bm90ZXNfcGFzcw== # notes_pass  ← change this in production!
