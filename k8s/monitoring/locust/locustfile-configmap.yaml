
# ─────────────────────────────────────────────────────────────────────────────
# Locust — locustfile ConfigMap
#
# Stores the same locustfile.py used in Session 7 (Docker Compose) but as a
# Kubernetes ConfigMap so the Locust Pod can mount it without building a
# custom image.
#
# To update the locustfile:
#   1. Edit the content below
#   2. kubectl apply -f k8s/monitoring/locust/locustfile-configmap.yaml
#   3. kubectl rollout restart deployment/locust -n monitoring
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: v1
kind: ConfigMap
metadata:
  name: locustfile
  namespace: monitoring
data:
  locustfile.py: |
    import random
    from locust import HttpUser, task, between

    _created_ids: list[int] = []

    _NOTE_TITLES = [
        "Stand-up notes", "Deployment checklist", "Bug triage",
        "Sprint planning", "Architecture decision", "Post-mortem draft",
        "Meeting action items", "Q4 roadmap", "On-call runbook",
        "Performance observations",
    ]

    _NOTE_CONTENTS = [
        "Discussed blocking issues. Three items need owner reassignment.",
        "Steps: pull latest, run migrations, smoke test /health endpoint.",
        "Root cause: connection pool exhausted under load.",
        "Velocity review complete. Added 12 tickets to backlog.",
        "Decided on event-driven architecture for notifications service.",
        "Timeline reconstructed. Primary cause identified. Mitigation deployed.",
        "Owner: Alice — update Grafana dashboard by Friday.",
        "Three major features: auth v2, API rate limiting, export to CSV.",
        "Alert → check /health → inspect logs → check DB → escalate if >5 min.",
        "API p99 latency climbed to 800ms at 200 concurrent users.",
    ]


    class NoteUser(HttpUser):
        wait_time = between(1, 3)

        def on_start(self):
            with self.client.get("/api/notes", catch_response=True) as resp:
                if resp.status_code == 200:
                    for note in resp.json()[:10]:
                        nid = note.get("id")
                        if nid and nid not in _created_ids:
                            _created_ids.append(nid)
                    resp.success()

        @task(5)
        def list_notes(self):
            self.client.get("/api/notes", name="GET /api/notes")

        @task(3)
        def read_note(self):
            if not _created_ids:
                self.client.get("/api/notes", name="GET /api/notes")
                return
            note_id = random.choice(_created_ids)
            with self.client.get(f"/api/notes/{note_id}", name="GET /api/notes/:id", catch_response=True) as resp:
                if resp.status_code == 404:
                    if note_id in _created_ids:
                        _created_ids.remove(note_id)
                    resp.success()
                elif resp.status_code != 200:
                    resp.failure(f"unexpected status {resp.status_code}")

        @task(2)
        def create_note(self):
            payload = {
                "title": random.choice(_NOTE_TITLES) + f" [{random.randint(1000,9999)}]",
                "content": random.choice(_NOTE_CONTENTS),
            }
            with self.client.post("/api/notes", json=payload, name="POST /api/notes", catch_response=True) as resp:
                if resp.status_code == 201:
                    nid = resp.json().get("id")
                    if nid:
                        _created_ids.append(nid)
                        if len(_created_ids) > 200:
                            _created_ids.pop(0)
                    resp.success()
                else:
                    resp.failure(f"POST /api/notes returned {resp.status_code}")

        @task(1)
        def update_note(self):
            if not _created_ids:
                return
            note_id = random.choice(_created_ids)
            payload = {
                "title": random.choice(_NOTE_TITLES) + f" [edited {random.randint(1,99)}]",
                "content": random.choice(_NOTE_CONTENTS) + " (updated)",
            }
            with self.client.put(f"/api/notes/{note_id}", json=payload, name="PUT /api/notes/:id", catch_response=True) as resp:
                if resp.status_code == 404:
                    if note_id in _created_ids:
                        _created_ids.remove(note_id)
                    resp.success()
                elif resp.status_code != 200:
                    resp.failure(f"PUT returned {resp.status_code}")

        @task(1)
        def health_check(self):
            with self.client.get("/health", name="GET /health", catch_response=True) as resp:
                if resp.status_code == 200 and resp.json().get("status") == "ok":
                    resp.success()
                else:
                    resp.failure(f"health returned {resp.status_code}")
