# Production deployment on VPS
#
# Extends docker-compose.yml with production overrides.
# Never run standalone — always use both files:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This file:
#   - Overrides api and frontend to use pre-built images from GHCR
#   - Adds Caddy for TLS termination
#   - Disables all monitoring services (Prometheus, Grafana, Locust,
#     node-exporter, cAdvisor, blackbox-exporter) — not needed in prod
#   - Only IMAGE_TAG needs to be set in .env on the server

services:

  db:
    restart: always
    deploy:
      resources:
        limits:
          memory: 256m

  api:
    image: ghcr.io/aras72h/devops-group/api:${IMAGE_TAG:-latest}
    build: !reset null
    restart: always
    deploy:
      resources:
        limits:
          memory: 256m

  frontend:
    image: ghcr.io/aras72h/devops-group/frontend:${IMAGE_TAG:-latest}
    build: !reset null
    restart: always
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 64m

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    networks:
      - notes_net
    deploy:
      resources:
        limits:
          memory: 64m

  # ── Monitoring disabled in production ────────────────────────────────────────
  # These services are for local development only. Setting scale: 0 prevents
  # them from starting when using the prod override.
  node-exporter:
    deploy:
      replicas: 0

  cadvisor:
    deploy:
      replicas: 0

  blackbox-exporter:
    deploy:
      replicas: 0

  prometheus:
    deploy:
      replicas: 0

  grafana:
    deploy:
      replicas: 0

  locust:
    deploy:
      replicas: 0

volumes:
  caddy_data:
  caddy_config:
