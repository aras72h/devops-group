# Production deployment on VPS
#
# Extends docker-compose.yml with production overrides.
# Never run standalone — always use both files:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Required .env vars on the server:
#   IMAGE_TAG   — git SHA set by CI (or "latest")
#   GHCR_TOKEN  — for docker login before pulling

services:
  db:
    restart: always
    deploy:
      resources:
        limits:
          memory: 256m

  api:
    image: ghcr.io/aras72h/devops-group/api:${IMAGE_TAG:-latest}
    build: !reset null
    restart: always
    deploy:
      resources:
        limits:
          memory: 256m

  frontend:
    image: ghcr.io/aras72h/devops-group/frontend:${IMAGE_TAG:-latest}
    build: !reset null
    restart: always
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 64m

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    networks:
      - notes_net
    deploy:
      resources:
        limits:
          memory: 64m

volumes:
  caddy_data:
  caddy_config:
