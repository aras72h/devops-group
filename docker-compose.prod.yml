# Production deployment on VPS
#
# Extends docker-compose.yml with production overrides.
# Never run standalone — always use both files:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d db api frontend
#
# No Caddy — the frontend is exposed directly on port 4000.
# TLS is handled by the existing web server on the host if needed.

services:

  db:
    restart: always
    deploy:
      resources:
        limits:
          memory: 256m

  api:
    image: ghcr.io/aras72h/devops-group/api:${IMAGE_TAG:-latest}
    build: !reset null
    restart: always
    deploy:
      resources:
        limits:
          memory: 256m

  frontend:
    image: ghcr.io/aras72h/devops-group/frontend:${IMAGE_TAG:-latest}
    build: !reset null
    restart: always
    ports:
      - "4000:80"
    deploy:
      resources:
        limits:
          memory: 64m

volumes: {}
